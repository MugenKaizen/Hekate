# Legacy profile registry used by bootstrap until profiles move into Hekate
# core. Profiles tune TDD and optional history guidance only. They cannot
# authorize commits, branches, destructive actions, subagents, or external
# harnesses. The selected profile is owned by `workflow.yml -> meta.profile`.

presets:
  fast:
    label: "Fast - minimal ceremony"
    description: "Adaptive workflow, TDD off, no local history."
    settings:
      tdd_mode: off
      history: false

  medium:
    label: "Medium - balanced"
    description: "Adaptive workflow, prefer test-first, no local history."
    settings:
      tdd_mode: prefer-test-first
      history: false

  full:
    label: "Full - stronger evidence"
    description: "Adaptive workflow with required test evidence and optional resumable notes."
    settings:
      tdd_mode: require-test-evidence
      history: true

settings:
  - id: tdd_mode
    controls: "workflow.yml -> process.tdd.mode"
    values: [off, prefer-test-first, require-test-evidence]
    question: "Which test evidence mode should apply?"
  - id: history
    controls: "workflow.yml -> process.history.enabled"
    question: "Enable concise local notes for resumable work?"
