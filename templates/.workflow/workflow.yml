# Legacy authored workflow configuration used until the v1 compiler contract is
# available. Presets select guidance; they never authorize Git or delegation.

hekate:
  enabled: true
  modules:
    workflow: true

meta:
  profile: null # fast | medium | full | custom | null

process:
  tdd:
    mode: prefer-test-first # off | prefer-test-first | require-test-evidence
  history:
    enabled: false
    path: .workflow/history/
  commit:
    consent: explicit-request-only

blocking:
  block_if_configs_missing: true
  required_files:
    - .workflow/config.yml
    - .workflow/project.yml
    - .workflow/workflow.yml
  required_non_empty_fields:
    project.yml: [identity.name, identity.kind, stack.languages, verification.test]
    config.yml: [workflow.profile]

bootstrap:
  new_project:
    ask_user: true
  existing_project:
    analyze_first: true
    confirm_with_user: true

scope_control:
  no_unrelated_refactors: true
  no_unrequested_dependencies: true
  ask_before_destructive: true
