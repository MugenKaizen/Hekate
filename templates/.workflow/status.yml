# Legacy fast preflight index. Phase 2 replaces this authored mirror with a
# deterministic generated status.lock.json.

schema_version: 1
initialized: false

checks:
  required_files_present: false
  required_fields_filled: false

source:
  workflow: .workflow/workflow.yml

lazy_load:
  project: .workflow/project.yml
  config: .workflow/config.yml
  bootstrap: .workflow/bootstrap.md
  history_format: .workflow/history-format.md

required_files:
  - .workflow/config.yml
  - .workflow/project.yml
  - .workflow/workflow.yml

required_non_empty_fields:
  project.yml: [identity.name, identity.kind, stack.languages, verification.test]
  config.yml: [workflow.profile]
