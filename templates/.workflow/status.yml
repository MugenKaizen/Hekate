# Fast pre-flight index for AI agents.
# Read this file at session start instead of loading every .workflow/*.yml.
# It is rewritten after /init-workflow or after deliberate workflow config edits.

schema_version: 1

initialized: false
active_preset: null

checks:
  required_files_present: false
  required_fields_filled: false

features:
  require_analysis: true
  require_plan: true
  require_options: true
  light_tdd: true
  granular_commits: true
  scope_control: true
  three_branch_model: false

orchestration:
  enabled: false
  default_harness: pi
  default_profile: null
  config: .workflow/orchestration.yml
  runner: .workflow/bin/hekate-agent

native_subagents:
  policy: .workflow/session.local.yml
  missing_or_invalid_mode: ask

lazy_load:
  # Each entry: read the file only when its condition applies. Never load
  # these speculatively at session start — see AGENTS.md §1.1 for the
  # authoritative condition text.
  stack: .workflow/stack.yml # when choosing commands/deps/runtime/framework specifics
  architecture: .workflow/architecture.yml # when changing module boundaries/layers/deps
  conventions: .workflow/conventions.yml # when creating/editing code, tests, docs, commits
  workflow_rules: .workflow/workflow.yml # when a process detail is missing from this file
  presets: .workflow/presets.yml # only during initialization or preset changes
  bootstrap: .workflow/bootstrap.md # only when pre-flight fails or /init-workflow is requested
  orchestration: .workflow/orchestration.yml # only when orchestration.enabled and task needs routing
  delegation: .workflow/delegation.md # only when actually delegating to an external CLI harness
  subagents: .workflow/subagents.md # only before the first native-subagent wave, or to change policy
  history_format: .workflow/history-format.md # only when creating/updating a task history entry

required_files:
  - .workflow/stack.yml
  - .workflow/architecture.yml
  - .workflow/conventions.yml
  - .workflow/workflow.yml
  - .workflow/presets.yml

required_non_empty_fields:
  stack.yml: [meta.project_name, meta.project_kind, languages]
  architecture.yml: [style, layers]
  conventions.yml: [code_style.formatter, naming.files, commits.style]

notes:
  - "If initialized is not true, active_preset is null, or any check is false, read .workflow/bootstrap.md."
  - "Do not read stack/architecture/conventions/workflow/presets at startup unless the fast check fails."
